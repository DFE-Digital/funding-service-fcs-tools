# .NET Desktop
# Build and run tests for .NET Desktop or Windows classic desktop solutions.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/windows/dot-net

name: $(Build.DefinitionName)-$(date:yyyyMMdd)$(rev:.r)

trigger:
  branches:
    include:
      - master
  paths:
    include:
      - AzureDiagnosticLogReaderUtil

pool: 'FCS SHARED DEV'

variables:
  solution: 'AzureDiagnosticLogReaderUtil\AzureDiagnosticLogReaderSolution\AzureDiagnosticLogReaderSolution.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  buildTarget: 'ILRepack'

steps:
- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  inputs:
    restoreSolution: '$(solution)'

- task: VSBuild@1
  inputs:
    solution: '$(solution)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    msbuildArgs: '/t:ILRepack'

- task: VSTest@2
  inputs:
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

- task: CopyFiles@2
  inputs:
    SourceFolder: 'AzureDiagnosticLogReaderUtil/AzureDiagnosticLogReaderSolution/AzureDiagnosticLogReader/bin/$(buildConfiguration)'
    Contents: 'AzureDiagnosticLogReader.ex*'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
    CleanTargetFolder: true
    flattenFolders: true

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'Binaries'
    publishLocation: 'Container'

